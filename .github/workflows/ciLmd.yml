name: ciLmd

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services: # ← esto es nuevo
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lambda_test
          POSTGRES_USER: lambda
          POSTGRES_PASSWORD: lambda
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Run migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://lambda:lambda@localhost:5432/lambda_test

      - name: Debug env
        run: printenv DATABASE_URL
        env:
          DATABASE_URL: postgresql://lambda:lambda@localhost:5432/lambda_test

      - name: Run tests
        run: npm run test
        env:
          DATABASE_URL: postgresql://lambda:lambda@localhost:5432/lambda_test
